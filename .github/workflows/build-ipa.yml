name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      send_ipa_here:
        description: Send the built IPA to this private session
        required: false
        type: boolean
        default: false
      handoff_token:
        description: One-time upload token for this session
        required: false
        type: string
        default: ''
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ThreeOneOSFive/airlift-rust-core/target
          key: ${{ runner.os }}-airlift-${{ hashFiles('ThreeOneOSFive/airlift-rust-core/Cargo.lock', 'ThreeOneOSFive/airlift-rust-core/Cargo.toml', 'ThreeOneOSFive/airlift-rust-core/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-airlift-

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build unsigned IPA
        run: bash ./build_supportpatch_unsigned.sh

      - name: Transfer IPA to this session
        if: ${{ inputs.send_ipa_here }}
        env:
          IPA_HANDOFF_TOKEN: ${{ inputs.handoff_token }}
        run: |
          set -euo pipefail
          test -n "$IPA_HANDOFF_TOKEN"
          echo "::add-mask::$IPA_HANDOFF_TOKEN"
          curl --fail --show-error --silent --retry 2 --retry-delay 2 \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/SupportPatch-unsigned.ipa \
            "https://8765-itrkmpd52hvra8cesqdbg-9bd4e1e5.us3.manus.computer/upload/$IPA_HANDOFF_TOKEN"

      - name: Upload IPA artifact
        if: ${{ !inputs.send_ipa_here }}
        uses: actions/upload-artifact@v4
        with:
          name: trystore-unsigned-ipa
          path: build/SupportPatch-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
