name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build unsigned IPA
        run: |
          chmod +x ./build_unsigned.sh ./build_esign_ready_ipa.sh
          ./build_unsigned.sh
          ./build_esign_ready_ipa.sh ./build/3105-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: trystore-unsigned-ipa
          path: build/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: trystore-xcarchive
          path: build/3105.xcarchive
          if-no-files-found: error
          retention-days: 7
