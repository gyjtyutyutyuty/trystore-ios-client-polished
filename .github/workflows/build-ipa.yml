name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build unsigned IPA
        run: bash ./build_supportpatch_unsigned.sh

      - name: Upload IPA to temporary draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ipa-build-${{ github.run_id }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Unsigned IPA build $GITHUB_RUN_NUMBER" \
            --notes "Temporary draft release for IPA delivery." \
            build/SupportPatch-unsigned.ipa
