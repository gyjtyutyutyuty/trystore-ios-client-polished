name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ThreeOneOSFive/airlift-rust-core/target
          key: ${{ runner.os }}-airlift-${{ hashFiles('ThreeOneOSFive/airlift-rust-core/Cargo.lock', 'ThreeOneOSFive/airlift-rust-core/Cargo.toml', 'ThreeOneOSFive/airlift-rust-core/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-airlift-

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build unsigned IPA
        run: bash ./build_supportpatch_unsigned.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: trystore-unsigned-ipa
          path: build/SupportPatch-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
