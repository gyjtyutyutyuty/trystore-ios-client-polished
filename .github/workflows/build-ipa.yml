name: Build unsigned iOS IPA

on:
  push:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the IPA as a public release asset only when explicitly enabled
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rust-core:
    # The Rust core is a prebuilt static library checked into the tree, so a
    # broken exploit.rs would only surface when someone rebuilds it on a Mac.
    # Checking it on every push keeps the prebuilt artefact honest.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ThreeOneOSFive/airlift-rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ThreeOneOSFive/airlift-rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check the Airlift Rust core
        working-directory: ThreeOneOSFive/airlift-rust-core
        run: cargo check --locked

  swift-build:
    # A compile, not an archive: the Swift changes in this repo were only ever
    # checked by eye before, and a typo should fail the push, not the release.
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      # The log is published to the ci-logs branch because the repository is
      # private and its run logs are not reachable from a cloud agent.
      - name: Compile the app
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme SupportPatch \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -n 200

      - name: Publish the compile log
        if: always()
        run: |
          set -euo pipefail
          {
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.run_id }}"
            echo "outcome: ${{ steps.compile.outcome }}"
            echo
            grep -E "error:|warning: .*never used|BUILD FAILED" /tmp/xcodebuild.log | tail -n 120 || true
            echo
            echo "--- last 400 lines ---"
            tail -n 400 /tmp/xcodebuild.log
          } > /tmp/compile.log
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@users.noreply.github.com
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@users.noreply.github.com
          blob=$(git hash-object -w /tmp/compile.log)
          tree=$(printf '100644 blob %s\tcompile.log\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "swift-build log for ${{ github.sha }}")
          git push --force origin "$commit:refs/heads/ci-logs"

      - name: Fail when the compile failed
        if: steps.compile.outcome == 'failure'
        run: exit 1

  ci-ping:
    # Cheap liveness probe in seconds instead of minutes: proves the runner starts
    # and its token can write a branch, which is the only channel a cloud agent
    # has into a private repository.
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Publish a marker branch
        run: |
          set -euo pipefail
          {
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.run_id }}"
            date -u +"at: %Y-%m-%dT%H:%M:%SZ"
          } > /tmp/ping.txt
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@users.noreply.github.com
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@users.noreply.github.com
          blob=$(git hash-object -w /tmp/ping.txt)
          tree=$(printf '100644 blob %s\tping.txt\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "ci ping ${{ github.sha }}")
          git push --force origin "$commit:refs/heads/ci-ping"

  build:
    # Pushes run the Rust check and the Swift compile; the IPA needs a manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    # macos-15 was terminating before checkout with no steps or logs.
    # macos-14 is the stable hosted image used for this unsigned build.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify local bundled patches
        run: python3 scripts/verify_legacy_patch_bundle.py

      - name: Show build environment
        run: xcodebuild -project ThreeOneOSFive.xcodeproj -list

      - name: Build unsigned IPA
        run: bash ./build_supportpatch_unsigned.sh

      - name: Verify the IPA
        run: |
          set -euo pipefail
          test -s build/SupportPatch-unsigned.ipa
          rm -rf /tmp/ipa-check && mkdir -p /tmp/ipa-check
          unzip -q build/SupportPatch-unsigned.ipa -d /tmp/ipa-check
          APP="/tmp/ipa-check/Payload/SupportPatch.app"
          test -x "$APP/SupportPatch"
          python3 scripts/verify_legacy_patch_bundle.py --app "$APP"
          test ! -e "$APP/CharacterVault"
          test ! -e "$APP/Patches"
          python3 tools/verify_ipa_hardening.py build/SupportPatch-unsigned.ipa
          python3 scripts/verify_ipa_release.py build/SupportPatch-unsigned.ipa
          shasum -a 256 build/SupportPatch-unsigned.ipa | tee build/SupportPatch-unsigned.ipa.sha256

      - name: Upload IPA artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trystore-unsigned-ipa
          path: |
            build/SupportPatch-unsigned.ipa
            build/SupportPatch-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload archive artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trystore-xcarchive
          path: build/SupportPatch.xcarchive
          if-no-files-found: error
          retention-days: 1

      - name: Publish release asset
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ipa-${{ github.run_number }}"
          gh release create "$tag" \
            build/SupportPatch-unsigned.ipa \
            build/SupportPatch-unsigned.ipa.sha256 \
            --title "Unsigned IPA ${{ github.run_number }}" \
            --notes "Unsigned build from ${{ github.sha }}. Sign it with your own certificate and provisioning profile before installing. This asset is public while the repository is public." \
            --target "${{ github.sha }}"
          echo "Download page: https://github.com/${{ github.repository }}/releases/tag/$tag"
