# /etc/nginx/sites-available/ffhub — included from the http block, which is
# where limit_req_zone/limit_conn_zone have to live.
#
# The API is only ever reached by the Sites Worker, which sends the bearer, so
# the front door is rate limited per IP and refuses anything that is not a GET
# or a POST. Exports are the expensive path: the zone allows a burst but not a
# loop, which is what an abusive caller looks like from here.

limit_req_zone $binary_remote_addr zone=ffhub_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ffhub_conn:10m;

server {
    listen 443 ssl http2;
    server_name hub.example.com;

    ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ffhub_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;
    proxy_read_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    limit_req zone=ffhub_api burst=20 nodelay;
    limit_conn ffhub_conn 10;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # GLB downloads stream straight through; buffering a large file only
        # doubles the disk write for no gain.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Plain HTTP only exists to answer the ACME challenge and push everything else
# to TLS; there is no cleartext API.
server {
    listen 80;
    server_name hub.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
