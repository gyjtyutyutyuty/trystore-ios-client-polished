workflows:
  supportpatch_unsigned_ipa:
    name: TryStore
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      xcode: latest
    scripts:
      - name: Validate merged project and current patch assets
        script: |
          set -euo pipefail
          echo "Building commit: $(git rev-parse HEAD)"
          test -f ThreeOneOSFive.xcodeproj/project.pbxproj
          test -f ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/SupportPatch.xcscheme
          test -f ThreeOneOSFive/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a
          test -f ThreeOneOSFive/AirliftFFI.xcframework/ios-arm64-simulator/libairlift_ffi.a
          patch_count="$(find ThreeOneOSFive/Patches -maxdepth 1 -type f -name '*.3105' | wc -l | tr -d ' ')"
          test "$patch_count" -eq 8
          test "$(find . -type f -name '*.3105' | wc -l | tr -d ' ')" -eq 8
          asset_bin_count="$(find ThreeOneOSFive/Assets.xcassets -type f -name '*.bin' | wc -l | tr -d ' ')"
          test "$asset_bin_count" -eq 8
          for package in \
            "HEAD.3105" \
            "NECK.3105" \
            "HSPESSCOSO.3105" \
            "HS SLA PECHO.3105" \
            "HOLOGRAMAARMAS.3105" \
            "HOLOGRAMAPERSONAJE.3105" \
            "HOLOGRAMAEXCLUSIVO(4).3105" \
            "HOLOGRAMAEXCLUSIVO(5).3105"; do
            test -s "ThreeOneOSFive/Patches/$package"
          done
          python3 scripts/verify_legacy_patch_bundle.py
          python3 scripts/verify_license_activation.py
      - name: Validate Airlift FFI and build unsigned archive/IPA
        script: |
          set -euo pipefail
          chmod +x ./ThreeOneOSFive/build-airlift-ffi.sh ./build_supportpatch_unsigned.sh
          REBUILD_AIRLIFT=0 ./build_supportpatch_unsigned.sh
      - name: Verify unsigned IPA contents
        script: |
          set -euo pipefail
          test -s build/SupportPatch-unsigned.ipa
          rm -rf /tmp/supportpatch-ipa-check
          mkdir -p /tmp/supportpatch-ipa-check
          unzip -q build/SupportPatch-unsigned.ipa -d /tmp/supportpatch-ipa-check
          APP="/tmp/supportpatch-ipa-check/Payload/SupportPatch.app"
          test -x "$APP/SupportPatch"
          test -f "$APP/Info.plist"
          python3 scripts/verify_legacy_patch_bundle.py --app "$APP"
    artifacts:
      - build/SupportPatch-unsigned.ipa
