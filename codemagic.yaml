workflows:
  supportpatch_unsigned_ipa:
    name: SupportPatch unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Validate merged project and current patch assets
        script: |
          set -euo pipefail
          echo "Building commit: $(git rev-parse HEAD)"
          test -f ThreeOneOSFive.xcodeproj/project.pbxproj
          test -f ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/SupportPatch.xcscheme
          test -f ThreeOneOSFive/AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a
          test -f ThreeOneOSFive/AirliftFFI.xcframework/ios-arm64-simulator/libairlift_ffi.a
          test -n "$(find ThreeOneOSFive/Assets.xcassets -type f -name '*.bin' -print -quit)"
          test "$(find . -type f -name '*.3105' | wc -l | tr -d ' ')" -eq 0
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme SupportPatch -list
      - name: Validate Airlift FFI and build unsigned archive/IPA
        script: |
          set -euo pipefail
          chmod +x ./ThreeOneOSFive/build-airlift-ffi.sh ./build_supportpatch_unsigned.sh
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup is not available on this Codemagic image; installing the stable Rust toolchain"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          source "$HOME/.cargo/env" 2>/dev/null || true
          command -v rustup
          command -v cargo
          REBUILD_AIRLIFT=1 ./ThreeOneOSFive/build-airlift-ffi.sh
          mkdir -p /tmp/xcodebuild_logs
          ./build_supportpatch_unsigned.sh 2>&1 | tee /tmp/xcodebuild_logs/build.log
      - name: Verify unsigned IPA contents
        script: |
          set -euo pipefail
          test -s build/SupportPatch-unsigned.ipa
          rm -rf /tmp/supportpatch-ipa-check
          mkdir -p /tmp/supportpatch-ipa-check
          unzip -q build/SupportPatch-unsigned.ipa -d /tmp/supportpatch-ipa-check
          APP="/tmp/supportpatch-ipa-check/Payload/SupportPatch.app"
          test -x "$APP/SupportPatch"
          test -f "$APP/Info.plist"
    artifacts:
      - build/SupportPatch-unsigned.ipa
      - build/SupportPatch.xcarchive
      - /tmp/xcodebuild_logs/*.log
