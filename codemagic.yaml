workflows:
  trystore_unsigned_ipa:
    name: TryStore unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.4
      vars:
        TRYSTORE_LICENSE_API_URL: https://jvztxnx-global-control.burgoajustin.workers.dev/api/v1/keys/validate
        TRYSTORE_PROJECT_ID: trystore
    scripts:
      - name: Validate Xcode project and build unsigned iOS archive
        script: |
          set -euo pipefail
          chmod +x ./build_unsigned.sh
          mkdir -p /tmp/xcodebuild_logs
          ./build_unsigned.sh 2>&1 | tee /tmp/xcodebuild_logs/build.log
    artifacts:
      - build/3105-unsigned.ipa
      - build/3105.xcarchive
      - /tmp/xcodebuild_logs/*.log
