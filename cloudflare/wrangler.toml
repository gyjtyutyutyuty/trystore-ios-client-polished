name = "trystore-patch-feed"
main = "patch-feed-worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# KV is used instead of R2 because R2 is not enabled on this account.
# Values hold the manifest JSON and patch blobs (KV ceiling: 25 MB per value).
[[kv_namespaces]]
binding = "PATCHES"
id = "a7f21b4f1ae54d0bbbf2773bd3f850fd"

# Rate counters, the licence-validation cache and emergency package overrides
# live in D1. KV writes have a small daily free quota and a counter write per
# request exhausted it, which took the whole feed down with 500s.
[[d1_databases]]
binding = "DB"
database_name = "jvztxnx-global-control"
database_id = "206d4900-6e0f-476e-9f3c-aaf85fde952e"

# Keep the original reseller/licence bot online. A Worker cannot reliably fetch
# another Worker on the same workers.dev zone, so use a service binding.
[[services]]
binding = "RESELLER"
service = "jvztxnx-global-control"

[vars]
PUBLIC_BASE_URL = "https://trystore-patch-feed.burgoajustin.workers.dev"
RESELLER_ORIGIN = "https://jvztxnx-global-control.burgoajustin.workers.dev"
PATCH_ADMIN_IDS = "7551063281,5869209007"

# Secrets (set with `wrangler secret put ...`):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET   must match the reseller worker's secret
#   TELEGRAM_OWNER_ID
#   APP_BUNDLE_KEY            32-byte base64 key version 1
#   APP_BUNDLE_KEY_V2         32-byte base64 key version 2, used after /rotate
#   APP_ATTEST_INTERNAL_TOKEN must be the same random 32+ character secret on both Workers
#
# Bundle-key rotation is a data change, not a deploy: set the next secret, run
# `/rotate trystore 2` in the admin bot, and only then delete the retired key.
# PATCH_BUNDLE_KEY_VERSION (a var) seeds the version for a project with no
# feed_key_state row yet.
