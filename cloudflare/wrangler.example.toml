# Copy to wrangler.toml locally; do not commit credentials.
name = "trystore-license-gateway"
main = "license-worker.js"
compatibility_date = "2026-09-12"

# Fill these in for your Cloudflare account/environment.
# account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

[[d1_databases]]
binding = "DB"
database_name = "YOUR_D1_DATABASE_NAME"
database_id = "YOUR_D1_DATABASE_ID"

# Add runtime secrets with:
# wrangler secret put TELEGRAM_BOT_TOKEN
# wrangler secret put TELEGRAM_WEBHOOK_SECRET
# wrangler secret put ADMIN_TELEGRAM_ID
